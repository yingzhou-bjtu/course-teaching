name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖（课程只需要 numpy；matplotlib 用于画图路径）
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib

      - name: 单元测试（ghfast 30 项 + notebook 端到端）
        run: python -m unittest discover -s tests -v

      - name: notebook 自检（真的把课程跑一遍）
        run: python -m unittest tests.test_notebook -v

      - name: ghfast 离线自检
        run: python ghfast/ghfast.py selftest

      - name: 打包单文件 zipapp
        run: python ghfast/build.py

      - name: 验证 zipapp 可执行
        run: python ghfast/dist/ghfast.pyz --version
